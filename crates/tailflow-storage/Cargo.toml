[package]
name = "tailflow-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Durable SQLite event store for TailFlow"

[dependencies]
tailflow-core = { path = "../tailflow-core" }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
regex = "1"
getrandom = "0.4"

# 0.41 (libsqlite3-sys 0.39, SQLite 3.54.1): the first release with the fix
# for RUSTSEC-2026-0459 / CVE-2026-119375; it is why the MSRV is 1.89.
# `bundled` compiles SQLite with FTS5 enabled, so behavior does not depend on
# the host's system library.
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache", "hooks", "functions"] }

[dev-dependencies]
tempfile = "3"
