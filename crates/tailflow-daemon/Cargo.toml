[package]
name = "tailflow-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "tailflow-daemon"
path = "src/main.rs"

[dependencies]
tailflow-core = { path = "../tailflow-core" }
tailflow-storage = { path = "../tailflow-storage" }

tokio = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# HTTP / SSE
axum = { workspace = true }
tower-http = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Agent spool watcher (same version as tailflow-core's file collector)
notify = "7"


# Embed the built web UI into the binary
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"

# Per-run API tokens, session and sign-in secrets (OS CSPRNG; already in the
# tree through tailflow-storage).
getrandom = "0.4"
# `stream::unfold` for the agent SSE stream (already in the tree via axum).
futures-util = { version = "0.3", default-features = false }

# O_DIRECTORY / O_NOFOLLOW when flushing the credential directory (already
# in the tree through tokio).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
chrono = { workspace = true }
