# tailflow.toml — place at your monorepo root
# Run `tailflow` or `tailflow-daemon` and all sources below start automatically.

[sources]
# Continuously discover running Docker containers, including replacements
docker = false

# Treat piped stdin as a named source (only used when piping into tailflow)
# stdin = "pipe"

# ── File sources ─────────────────────────────────────────────────────────────
# [[sources.file]]
# path = "logs/app.log"
# label = "app"          # optional; defaults to filename

# [[sources.file]]
# path = "/var/log/nginx/access.log"

# ── Process sources ───────────────────────────────────────────────────────────
# TailFlow spawns these processes and captures their stdout + stderr.
# Stopping TailFlow also stops their process trees.

# [[sources.process]]
# label = "frontend"
# cmd   = "npm run dev --prefix packages/web"

# [[sources.process]]
# label = "api"
# cmd   = "go run ./cmd/api"
# restart = "on-failure"   # never (default), on-failure, or always
# restart_delay_ms = 1000  # doubles after each restart, capped at 30 seconds

# [[sources.process]]
# label = "worker"
# cmd   = "cargo run -p my-worker"
