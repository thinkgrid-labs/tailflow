[workspace]
members = [
    "crates/tailflow-core",
    "crates/tailflow-tui",
    "crates/tailflow-daemon",
    "crates/tailflow-agent",
    "crates/tailflow-storage",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
authors = ["DennisP."]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors"] }

# Release builds ship to npm, Homebrew and GitHub releases. Measured during
# M1.5 on the daemon's own workloads: fat LTO + one codegen unit + stripped
# symbols cut every binary 31–37 % (daemon 11.1 → 7.7 MB) with CPU
# equal or slightly better. `opt-level = "s"/"z"` were smaller still but cost
# ~20 % / ~26 % CPU per ingested line — not worth it for an always-on daemon.
# `panic` stays `unwind`: collectors and handlers rely on a panicking task
# being caught and logged (and poisoned locks recovered) instead of the whole
# daemon — and its storage queue — aborting.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
