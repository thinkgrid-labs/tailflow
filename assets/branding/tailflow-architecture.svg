<text x="270" y="530" fill="#22d3ee" font-size="15" font-weight="700" letter-spacing="1.5">PLANNED</text>
<g fill="#9ca3af" font-size="18">
<text x="96" y="160">stdout + stderr of commands it runs</text>
<text x="96" y="252">every container on the local daemon</text>
<text x="96" y="344">appended lines, survives rotation</text>
<text x="96" y="436">pipe any command's output in</text>
<text x="96" y="556">sessions, tool calls,</text>
<text x="96" y="578">file edits, commands</text>
<text x="1160" y="160">http://127.0.0.1:7878</text>
<text x="1160" y="252">/api/* live · /api/v1/* history</text>
<text x="1160" y="344">MCP stdio → Claude Code, MCP clients</text>
<text x="1160" y="436">shell CLI → agents and scripts</text>
<text x="632" y="176">Rust · listens on 127.0.0.1 only</text>
<text x="652" y="252" font-size="16">severity · error fingerprints</text>
<text x="652" y="332" font-size="16">before display and storage</text>
<text x="652" y="414" font-size="16">bounded ring</text>
<text x="652" y="434" font-size="16">in memory</text>
<text x="828" y="414" font-size="16">SQLite on disk</text>
<text x="828" y="434" font-size="16">30-day default,</text>
<text x="828" y="454" font-size="16">2 GB cap</text>
<text x="632" y="516" font-size="16">Runs on your machine. History is one</text>
<text x="632" y="538" font-size="16">events.db in your user data directory;</text>
<text x="632" y="560" font-size="16">nothing is uploaded.</text>
<text x="72" y="660" font-size="17">Solid boxes are implemented; dashed boxes are planned. The tailflow TUI reads sources directly and keeps no history.</text>
</g>
