<text x="96" y="134">Dev processes</text>
<text x="96" y="226">Docker containers</text>
<text x="96" y="318">Log files</text>
<text x="96" y="410">Piped stdin</text>
<text x="96" y="530" fill="#9ca3af">Agent activity</text>
<text x="1160" y="134">Web dashboard</text>
<text x="1160" y="226">HTTP API + SSE</text>
<text x="652" y="228" font-size="21">Detect level, group errors</text>
<text x="652" y="308" font-size="21">Redact secrets</text>
<text x="652" y="390" font-size="21">Live buffer</text>
<text x="828" y="390" font-size="21">History</text>
