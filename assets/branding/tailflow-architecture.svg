<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="t d">
<title id="t">TailFlow architecture</title>
<desc id="d">Sources (dev processes, Docker containers, log files, piped stdin) flow into tailflow-daemon, a Rust process on 127.0.0.1 that detects severity, groups errors, redacts secrets, and keeps a live in-memory buffer plus local SQLite history. The daemon serves a web dashboard, an HTTP and SSE API, the tailflow-mcp server for MCP clients such as Claude Code, and the tailflow-logs shell CLI. Agent activity collectors are planned and not yet available.</desc>
